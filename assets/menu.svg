  <text class="t" x="90" y="205" fill="#00d4d4">║   <tspan fill="#00d4d4">[1]</tspan>  <tspan fill="#ffffff">Diagnóstico completo</tspan>                              ║</text>
  <text class="t" x="90" y="225" fill="#00d4d4">║   <tspan fill="#00d4d4">[2]</tspan>  <tspan fill="#ffffff">Identidade do computador e BIOS</tspan>                   ║</text>
