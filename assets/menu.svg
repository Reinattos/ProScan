  <text class="t" x="90" y="305" fill="#00d4d4">║   <tspan fill="#00d4d4">[6]</tspan>  <tspan fill="#ffffff">Programas instalados recentemente</tspan>                 ║</text>
  <text class="t" x="90" y="325" fill="#00d4d4">║   <tspan fill="#00d4d4">[7]</tspan>  <tspan fill="#ffffff">Buscar máquina na rede</tspan>                            ║</text>
